name = "skagit-parcels"
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "none"
run_worker_first = ["/", "/health", "/parcel/*", "/parcels", "/ask", "/admin/*"]

[triggers]
# 2am PST = 10:00 UTC, 3:30am PST = 11:30 UTC
crons = ["30 11 * * *"]   # geo-enrich only — ingest runs in GitHub Actions

[[r2_buckets]]
binding = "PARCEL_STORE"
bucket_name = "raw-parcels"

[[d1_databases]]
binding = "PARCEL_DB"
database_name = "skagit-parcels"
database_id = "bd1fd2cb-9d82-4068-a79a-de55c83cc981"
