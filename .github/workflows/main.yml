name: Weekly Parcel Ingest
on:
  schedule:
    - cron: '0 10 * * 0'   # Sunday 2am PST (assessor data rarely changes daily)
  workflow_dispatch:         # Manual trigger via GitHub Actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build full repair SQL
        run: node scripts/ingest-node.js
        env:
          FORCE_FULL_REINGEST: '1'
          OUTPUT_SQL_FILE: parcel-import.sql

      - name: Import full repair SQL
        run: npx wrangler d1 execute skagit-parcels --remote --file parcel-import.sql --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
